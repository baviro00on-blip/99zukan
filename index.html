<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九九のずかん</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: #f0fdf4;
    }
    .font-kiwi {
      font-family: 'Kiwi Maru', serif;
    }
    .plate-shadow {
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.15));
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-slate-800 select-none bg-emerald-50/50">

  <!-- 花吹雪（Confetti）用キャンバス -->
  <canvas id="confetti-canvas" class="pointer-events-none fixed inset-0 z-50 hidden"></canvas>

  <!-- ヘッダー -->
  <header class="bg-emerald-700 text-white px-3 py-0.5 flex items-center justify-between shadow-sm flex-shrink-0 z-20">
    <div class="flex items-center gap-2">
      <span class="text-base md:text-lg">🔴</span>
      <h1 class="text-sm md:text-base font-bold font-kiwi tracking-wide">九九のずかん</h1>
      
      <!-- モード切り替えボタン -->
      <button id="mode-toggle-btn" class="ml-2 bg-amber-400 hover:bg-amber-500 active:scale-95 text-amber-950 font-bold text-xs md:text-sm px-2.5 py-0.5 rounded-full shadow border-2 border-amber-200 transition-all flex items-center gap-1">
        <span>🎮 もんだいモード</span>
      </button>
    </div>

    <!-- 問題進行用 10個の赤長方形 (「きほん/もんだいモード」ボタンと「効果音ON」ボタンの間) -->
    <div id="quiz-progress-rects" class="hidden flex items-center gap-1 mx-2">
      <div class="progress-rect w-7 h-2.5 md:w-10 md:h-3.5 bg-red-600 rounded-xs border border-red-800/40 shadow-xs transition-colors duration-300"></div>
      <div class="progress-rect w-7 h-2.5 md:w-10 md:h-3.5 bg-red-600 rounded-xs border border-red-800/40 shadow-xs transition-colors duration-300"></div>
      <div class="progress-rect w-7 h-2.5 md:w-10 md:h-3.5 bg-red-600 rounded-xs border border-red-800/40 shadow-xs transition-colors duration-300"></div>
      <div class="progress-rect w-7 h-2.5 md:w-10 md:h-3.5 bg-red-600 rounded-xs border border-red-800/40 shadow-xs transition-colors duration-300"></div>
      <div class="progress-rect w-7 h-2.5 md:w-10 md:h-3.5 bg-red-600 rounded-xs border border-red-800/40 shadow-xs transition-colors duration-300"></div>
      <div class="progress-rect w-7 h-2.5 md:w-10 md:h-3.5 bg-red-600 rounded-xs border border-red-800/40 shadow-xs transition-colors duration-300"></div>
      <div class="progress-rect w-7 h-2.5 md:w-10 md:h-3.5 bg-red-600 rounded-xs border border-red-800/40 shadow-xs transition-colors duration-300"></div>
      <div class="progress-rect w-7 h-2.5 md:w-10 md:h-3.5 bg-red-600 rounded-xs border border-red-800/40 shadow-xs transition-colors duration-300"></div>
      <div class="progress-rect w-7 h-2.5 md:w-10 md:h-3.5 bg-red-600 rounded-xs border border-red-800/40 shadow-xs transition-colors duration-300"></div>
      <div class="progress-rect w-7 h-2.5 md:w-10 md:h-3.5 bg-red-600 rounded-xs border border-red-800/40 shadow-xs transition-colors duration-300"></div>
    </div>

    <button id="voice-toggle-btn" class="bg-emerald-800 hover:bg-emerald-900 text-xs px-2.5 py-0.5 rounded-full flex items-center gap-1 border border-emerald-500 transition-all">
      <span>🔊 効果音: <span id="voice-status">ON</span></span>
    </button>
  </header>

  <!-- 全体コンテンツコンテナ -->
  <main class="flex-1 flex flex-col p-0.5 gap-0.5 max-w-5xl mx-auto w-full min-h-0 relative">

    <!-- 1. 上部：描画エリア（皿と赤玉） -->
    <section class="flex-1 bg-emerald-900/10 rounded-xl border-2 border-emerald-800/20 shadow-inner p-0 flex flex-col items-center justify-center relative min-h-0 overflow-hidden">
      
      <!-- 背景模様 -->
      <div class="absolute inset-0 opacity-5 pointer-events-none bg-[radial-gradient(#000_1px,transparent_1px)] [background-size:16px_16px]"></div>

      <!-- 正解 / 不正解 のオーバーレイ演出表示 -->
      <div id="feedback-overlay" class="pointer-events-none absolute inset-0 z-30 flex flex-col items-center justify-center bg-white/40 backdrop-blur-[2px] transition-all opacity-0 scale-50 hidden">
        <div id="feedback-icon" class="text-7xl md:text-9xl drop-shadow-lg">⭕</div>
        <div id="feedback-text" class="text-xl md:text-3xl font-black font-kiwi text-rose-600 bg-white/90 px-6 py-2 rounded-full shadow-md mt-2">
          せいかい！
        </div>
      </div>

      <!-- 皿のレイアウト（5個×2段 固定グリッド） -->
      <div id="dish-grid" class="w-full h-full grid grid-cols-5 grid-rows-2 justify-items-center items-center gap-0 p-0 z-10">
        <!-- JSで動的に皿(SVG)を描画 -->
      </div>

    </section>

    <!-- 2. 下部：式表示エリア -->
    <section class="bg-white rounded-xl p-1 md:p-1.5 shadow-lg border-2 border-emerald-100 flex flex-col items-center flex-shrink-0">
      
      <div class="flex items-center justify-center gap-2 md:gap-4 w-full flex-wrap">

        <!-- かけられる数 (左に上下ボタン) -->
        <div class="flex items-center gap-1.5 md:gap-2 bg-amber-50 p-1 md:p-1.5 rounded-xl border-2 border-amber-200">
          <!-- 左の上下ボタン -->
          <div class="flex flex-col gap-0.5">
            <button id="num1-up" class="w-8 h-8 md:w-11 md:h-11 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-black text-sm md:text-xl rounded-lg shadow-sm transition-all flex items-center justify-center">
              ▲
            </button>
            <button id="num1-down" class="w-8 h-8 md:w-11 md:h-11 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-black text-sm md:text-xl rounded-lg shadow-sm transition-all flex items-center justify-center">
              ▼
            </button>
          </div>
          <div class="flex flex-col items-center px-1">
            <span class="text-[10px] md:text-xs text-amber-800 font-bold whitespace-nowrap">玉の数</span>
            <span id="num1-display" class="text-3xl md:text-5xl font-black text-amber-900 w-8 md:w-12 text-center leading-none">1</span>
          </div>
        </div>

        <!-- かける記号 -->
        <span class="text-3xl md:text-5xl font-black text-slate-400">✕</span>

        <!-- かける数 (右に上下ボタン) -->
        <div class="flex items-center gap-1.5 md:gap-2 bg-sky-50 p-1 md:p-1.5 rounded-xl border-2 border-sky-200">
          <div class="flex flex-col items-center px-1">
            <span class="text-[10px] md:text-xs text-sky-800 font-bold whitespace-nowrap">皿の数</span>
            <span id="num2-display" class="text-3xl md:text-5xl font-black text-sky-900 w-8 md:w-12 text-center leading-none">1</span>
          </div>
          <!-- 右の上下ボタン -->
          <div class="flex flex-col gap-0.5">
            <button id="num2-up" class="w-8 h-8 md:w-11 md:h-11 bg-sky-500 hover:bg-sky-600 active:scale-95 text-white font-black text-sm md:text-xl rounded-lg shadow-sm transition-all flex items-center justify-center">
              ▲
            </button>
            <button id="num2-down" class="w-8 h-8 md:w-11 md:h-11 bg-sky-500 hover:bg-sky-600 active:scale-95 text-white font-black text-sm md:text-xl rounded-lg shadow-sm transition-all flex items-center justify-center">
              ▼
            </button>
          </div>
        </div>

        <!-- イコール -->
        <span class="text-3xl md:text-5xl font-black text-slate-400">=</span>

        <!-- 答え枠 と こたえ/かいとうボタン -->
        <div class="flex items-center gap-2">
          <div id="answer-box" class="w-16 md:w-24 h-12 md:h-16 bg-slate-100 border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center transition-all">
            <span id="answer-text" class="text-3xl md:text-5xl font-black text-emerald-600 hidden leading-none">1</span>
            <span id="answer-placeholder" class="text-2xl md:text-3xl text-slate-400 font-bold">？</span>
          </div>

          <button id="answer-btn" class="bg-rose-500 hover:bg-rose-600 active:scale-95 text-white text-sm md:text-xl font-bold px-3 py-2.5 md:px-5 md:py-3.5 rounded-xl shadow-md border-b-4 border-rose-700 transition-all flex items-center justify-center">
            こたえ
          </button>
        </div>

      </div>

    </section>

  </main>

  <!-- 10問終了後の「けっかはっぴょう」モーダル -->
  <div id="result-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl border-4 border-amber-300 flex flex-col items-center text-center animate-pop">
      <div class="text-4xl md:text-5xl mb-2">🎉</div>
      <h2 class="text-2xl md:text-3xl font-black font-kiwi text-amber-600 mb-2">けっかはっぴょう！</h2>
      
      <div class="w-full bg-amber-50 rounded-2xl p-6 border-2 border-amber-200 flex flex-col items-center justify-center my-4">
        <div class="text-2xl md:text-4xl font-black text-rose-500 font-kiwi">
          よくがんばったね
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 w-full mt-2">
        <button id="retry-btn" class="flex-1 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-md border-b-4 border-amber-700 transition-all text-sm md:text-base flex items-center justify-center gap-1">
          🎮 もんだい
        </button>
        <button id="return-menu-btn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-md border-b-4 border-emerald-800 transition-all text-sm md:text-base flex items-center justify-center gap-1">
          📖 きほん
        </button>
      </div>
    </div>
  </div>

  <script>
    // モード状態 ('basic' | 'quiz')
    let currentMode = 'basic';

    // 基本モード用の選択値
    let multiplicand = 1; // 1皿の数 (1~9)
    let multiplier = 1;   // 皿の数 (1~9)
    let isAnswerVisible = false;
    let isSoundEnabled = true;

    // 問題モード用の状態
    let quizQuestionIndex = 0; // 0 ~ 9 (全10問)
    let targetMultiplicand = 1;
    let targetMultiplier = 1;
    let quizQuestions = []; // 出題する10問のリスト（重複防止用）
    let firstTryCount = 0;
    let modifiedCount = 0;
    let isCurrentQuestionFailed = false; // 現在の問題で一度でも間違えたか

    // DOM要素
    const modeToggleBtn = document.getElementById('mode-toggle-btn');
    const num1Display = document.getElementById('num1-display');
    const num2Display = document.getElementById('num2-display');
    const answerText = document.getElementById('answer-text');
    const answerPlaceholder = document.getElementById('answer-placeholder');
    const answerBox = document.getElementById('answer-box');
    const answerBtn = document.getElementById('answer-btn');
    const dishGrid = document.getElementById('dish-grid');
    const voiceToggleBtn = document.getElementById('voice-toggle-btn');
    const voiceStatus = document.getElementById('voice-status');

    // 問題モード用DOM
    const quizProgressRects = document.getElementById('quiz-progress-rects');
    const feedbackOverlay = document.getElementById('feedback-overlay');
    const feedbackIcon = document.getElementById('feedback-icon');
    const feedbackText = document.getElementById('feedback-text');
    const resultModal = document.getElementById('result-modal');
    const resultScore = document.getElementById('result-score');
    const retryBtn = document.getElementById('retry-btn');
    const returnMenuBtn = document.getElementById('return-menu-btn');

    // イベント登録
    document.getElementById('num1-up').addEventListener('click', () => changeNum1(1));
    document.getElementById('num1-down').addEventListener('click', () => changeNum1(-1));
    document.getElementById('num2-up').addEventListener('click', () => changeNum2(1));
    document.getElementById('num2-down').addEventListener('click', () => changeNum2(-1));
    answerBtn.addEventListener('click', handleMainAction);

    modeToggleBtn.addEventListener('click', toggleMode);
    retryBtn.addEventListener('click', startQuizMode);
    returnMenuBtn.addEventListener('click', () => {
      resultModal.classList.add('hidden');
      switchMode('basic');
    });

    voiceToggleBtn.addEventListener('click', () => {
      isSoundEnabled = !isSoundEnabled;
      voiceStatus.textContent = isSoundEnabled ? 'ON' : 'OFF';
      voiceToggleBtn.classList.toggle('bg-emerald-800', isSoundEnabled);
      voiceToggleBtn.classList.toggle('bg-slate-500', !isSoundEnabled);
    });

    // モード切替
    function toggleMode() {
      if (currentMode === 'basic') {
        switchMode('quiz');
      } else {
        switchMode('basic');
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      if (currentMode === 'basic') {
        modeToggleBtn.innerHTML = '<span>🎮 もんだいモード</span>';
        quizProgressRects.classList.add('hidden');
        answerBtn.textContent = 'こたえ';
        multiplicand = 1;
        multiplier = 1;
        hideAnswer();
        updateView();
      } else {
        modeToggleBtn.innerHTML = '<span>📖 きほんモード</span>';
        quizProgressRects.classList.remove('hidden');
        answerBtn.textContent = 'かいとう';
        startQuizMode();
      }
    }

    // 問題モード開始
    function startQuizMode() {
      resultModal.classList.add('hidden');
      quizQuestionIndex = 0;
      firstTryCount = 0;
      modifiedCount = 0;

      // 1~9の組み合わせ（全81通り）を生成してシャッフルし、重複のない10問を選択
      const pool = [];
      for (let i = 1; i <= 9; i++) {
        for (let j = 1; j <= 9; j++) {
          pool.push({ multiplicand: i, multiplier: j });
        }
      }
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      quizQuestions = pool.slice(0, 10);

      updateProgressRects(0);
      nextQuestion();
    }

    // 出題生成
    function nextQuestion() {
      quizQuestionIndex++;
      if (quizQuestionIndex > 10) {
        updateProgressRects(10);
        showResults();
        return;
      }

      isCurrentQuestionFailed = false;
      updateProgressRects(quizQuestionIndex - 1);

      // 重複のないリストから現在の問題を設定
      const q = quizQuestions[quizQuestionIndex - 1];
      targetMultiplicand = q.multiplicand;
      targetMultiplier = q.multiplier;

      // 解答者の初期値は 1 x 1 にリセット
      multiplicand = 1;
      multiplier = 1;

      hideAnswer();
      updateView();
    }

    // 進行状況（10個の赤い長方形）を右から順に黒へ変更
    function updateProgressRects(completedCount) {
      if (!quizProgressRects) return;
      const rects = quizProgressRects.querySelectorAll('.progress-rect');
      rects.forEach((rect, idx) => {
        // 右から順に黒色へ変更（10 - completedCount 以上のインデックス）
        if (idx >= 10 - completedCount) {
          rect.classList.remove('bg-red-600');
          rect.classList.add('bg-black');
        } else {
          rect.classList.remove('bg-black');
          rect.classList.add('bg-red-600');
        }
      });
    }

    function changeNum1(delta) {
      multiplicand += delta;
      if (multiplicand > 9) multiplicand = 1;
      if (multiplicand < 1) multiplicand = 9;
      if (currentMode === 'basic') hideAnswer();
      updateView();
      playClickSound(440 + multiplicand * 30);
    }

    function changeNum2(delta) {
      multiplier += delta;
      if (multiplier > 9) multiplier = 1;
      if (multiplier < 1) multiplier = 9;
      if (currentMode === 'basic') hideAnswer();
      updateView();
      playClickSound(330 + multiplier * 30);
    }

    function handleMainAction() {
      if (currentMode === 'basic') {
        toggleAnswer();
      } else {
        checkQuizAnswer();
      }
    }

    // 基本モード：答え切り替え
    function toggleAnswer() {
      isAnswerVisible = !isAnswerVisible;
      if (isAnswerVisible) {
        answerText.textContent = multiplicand * multiplier;
        answerText.classList.remove('hidden');
        answerPlaceholder.classList.add('hidden');
        answerBox.classList.remove('bg-slate-100', 'border-slate-300');
        answerBox.classList.add('bg-emerald-100', 'border-emerald-400');
        
        playFanfareSound();
      } else {
        hideAnswer();
      }
      updateView();
    }

    // 問題モード：判定処理
    function checkQuizAnswer() {
      const isCorrect = (multiplicand === targetMultiplicand && multiplier === targetMultiplier);

      if (isCorrect) {
        // 正解カウント
        if (!isCurrentQuestionFailed) {
          firstTryCount++;
        } else {
          modifiedCount++;
        }

        // 答え表示枠を緑に
        answerText.textContent = multiplicand * multiplier;
        answerText.classList.remove('hidden');
        answerPlaceholder.classList.add('hidden');
        answerBox.classList.remove('bg-slate-100', 'border-slate-300');
        answerBox.classList.add('bg-emerald-100', 'border-emerald-400');

        showFeedback(true, "せいかい！");
        playFanfareSound();
        triggerConfetti();

        setTimeout(() => {
          hideFeedback();
          nextQuestion();
        }, 1800);

      } else {
        // 不正解
        isCurrentQuestionFailed = true;
        showFeedback(false, "おしい！もう一度かんがえよう");
        playBuzzerSound();

        setTimeout(() => {
          hideFeedback();
        }, 1400);
      }
      updateView();
    }

    function showFeedback(isCorrect, message) {
      feedbackIcon.textContent = isCorrect ? '⭕' : '❌';
      feedbackText.textContent = message;
      feedbackText.className = `text-xl md:text-3xl font-black font-kiwi px-6 py-2 rounded-full shadow-md mt-2 ${
        isCorrect ? 'text-rose-600 bg-white/95' : 'text-indigo-600 bg-white/95'
      }`;

      feedbackOverlay.classList.remove('hidden');
      setTimeout(() => {
        feedbackOverlay.classList.remove('opacity-0', 'scale-50');
        feedbackOverlay.classList.add('opacity-100', 'scale-100');
      }, 10);
    }

    function hideFeedback() {
      feedbackOverlay.classList.remove('opacity-100', 'scale-100');
      feedbackOverlay.classList.add('opacity-0', 'scale-50');
      setTimeout(() => {
        feedbackOverlay.classList.add('hidden');
      }, 200);
    }

    function showResults() {
      resultModal.classList.remove('hidden');
      triggerConfetti();
      playFanfareSound();
    }

    function hideAnswer() {
      isAnswerVisible = false;
      answerText.classList.add('hidden');
      answerPlaceholder.classList.remove('hidden');
      answerBox.classList.remove('bg-emerald-100', 'border-emerald-400');
      answerBox.classList.add('bg-slate-100', 'border-slate-300');
    }

    function updateView() {
      num1Display.textContent = multiplicand;
      num2Display.textContent = multiplier;

      // 描画エリアに表示する数値（基本モード時は選択値、問題モード時はターゲット出題値）
      const displayMultiplicand = (currentMode === 'quiz') ? targetMultiplicand : multiplicand;
      const displayMultiplier = (currentMode === 'quiz') ? targetMultiplier : multiplier;

      renderDishes(displayMultiplicand, displayMultiplier);
    }

    // 皿（Dish）と赤玉の描画
    function renderDishes(countPerDish, dishCount) {
      dishGrid.innerHTML = '';

      for (let i = 0; i < dishCount; i++) {
        const dishDiv = document.createElement('div');
        // 5列×2段の固定配置： 0~4は1段目、5~8は2段目
        const row = i < 5 ? 1 : 2;
        const col = (i % 5) + 1;

        dishDiv.className = 'w-full h-full flex items-center justify-center p-0 animate-pop';
        dishDiv.style.gridRow = `${row}`;
        dishDiv.style.gridColumn = `${col}`;

        dishDiv.innerHTML = createDishSVG(countPerDish);
        dishGrid.appendChild(dishDiv);
      }
    }

    // 皿SVGと赤玉の組み合わせを生成
    function createDishSVG(ballCount) {
      const getBallPositions = (count) => {
        switch (count) {
          case 1: return [{x:50, y:50, r:14}];
          case 2: return [{x:35, y:35, r:12}, {x:65, y:65, r:12}];
          case 3: return [{x:30, y:70, r:11}, {x:50, y:50, r:11}, {x:70, y:30, r:11}];
          case 4: return [{x:32, y:32, r:10.5}, {x:68, y:32, r:10.5}, {x:32, y:68, r:10.5}, {x:68, y:68, r:10.5}];
          case 5: return [{x:30, y:30, r:9.5}, {x:70, y:30, r:9.5}, {x:50, y:50, r:9.5}, {x:30, y:70, r:9.5}, {x:70, y:70, r:9.5}];
          case 6: return [{x:34, y:26, r:9}, {x:66, y:26, r:9}, {x:34, y:50, r:9}, {x:66, y:50, r:9}, {x:34, y:74, r:9}, {x:66, y:74, r:9}];
          case 7: return [{x:30, y:24, r:8.5}, {x:50, y:33, r:8.5}, {x:70, y:42, r:8.5}, {x:34, y:62, r:8.5}, {x:66, y:62, r:8.5}, {x:34, y:80, r:8.5}, {x:66, y:80, r:8.5}];
          case 8: return [{x:34, y:24, r:8}, {x:66, y:24, r:8}, {x:34, y:42, r:8}, {x:66, y:42, r:8}, {x:34, y:60, r:8}, {x:66, y:60, r:8}, {x:34, y:78, r:8}, {x:66, y:78, r:8}];
          case 9: return [
            {x:30, y:26, r:8}, {x:50, y:26, r:8}, {x:70, y:26, r:8},
            {x:30, y:50, r:8}, {x:50, y:50, r:8}, {x:70, y:50, r:8},
            {x:30, y:74, r:8}, {x:50, y:74, r:8}, {x:70, y:74, r:8}
          ];
          default: return [];
        }
      };

      const balls = getBallPositions(ballCount);
      const ballsHTML = balls.map(b => `
        <circle cx="${b.x}" cy="${b.y}" r="${b.r}" fill="url(#ballGrad)" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.3))"/>
        <circle cx="${b.x - b.r * 0.3}" cy="${b.y - b.r * 0.3}" r="${b.r * 0.25}" fill="#ffffff" opacity="0.6"/>
      `).join('');

      return `
        <svg viewBox="0 0 100 100" class="w-full h-full max-w-full max-h-full drop-shadow-md">
          <defs>
            <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#ff8888" />
              <stop offset="40%" stop-color="#e11d48" />
              <stop offset="100%" stop-color="#881337" />
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="48" fill="#fcfbf7" stroke="#d4ceb8" stroke-width="2"/>
          <circle cx="50" cy="50" r="40" fill="#f4efe2" stroke="#e6dfcc" stroke-width="1.5"/>
          <circle cx="50" cy="50" r="32" fill="#eae3d2" opacity="0.4"/>
          ${ballsHTML}
        </svg>
      `;
    }

    // 音声効果 (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playClickSound(freq = 440) {
      if (!isSoundEnabled) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function playFanfareSound() {
      if (!isSoundEnabled) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.1);
          osc.stop(audioCtx.currentTime + idx * 0.1 + 0.3);
        });
      } catch (e) {}
    }

    function playBuzzerSound() {
      if (!isSoundEnabled) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {}
    }

    // 紙吹雪アニメーション
    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.classList.remove('hidden');

      const particles = [];
      const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];

      for (let i = 0; i < 70; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.7) * 14,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10
        });
      }

      let startTime = Date.now();
      function animateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let elapsed = Date.now() - startTime;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.3;
          p.rotation += p.vRot;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });

        if (elapsed < 1500) {
          requestAnimationFrame(animateConfetti);
        } else {
          canvas.classList.add('hidden');
        }
      }
      animateConfetti();
    }

    // 初期起動処理
    updateView();
  </script>
</body>
